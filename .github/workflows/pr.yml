name: PR Checks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    name: Test, Format, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format
        run: npm run format

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
